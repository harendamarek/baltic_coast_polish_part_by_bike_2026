<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Polskie Wybrzeże — kolekcja latarni morskich</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;}
body{background:#080a0f;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;}
.wrap{background:#0f1117;border-radius:16px;overflow:hidden;color:#e8e6df;width:100%;max-width:960px;box-shadow:0 8px 48px rgba(0,0,0,.6);}
.header{padding:20px 24px 16px;border-bottom:0.5px solid #2a2d38;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.header-title{font-size:16px;font-weight:500;color:#e8e6df;letter-spacing:-0.02em;}
.header-sub{font-size:12px;color:#6b6f7e;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#2a2d38;}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr);}}
.stat{background:#161820;padding:14px 18px;}
.stat-label{font-size:10px;color:#6b6f7e;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;}
.stat-val{font-size:23px;font-weight:500;color:#e8e6df;line-height:1;letter-spacing:-0.02em;}
.stat-unit{font-size:12px;color:#6b6f7e;font-weight:400;}
.stat-sub{font-size:11px;color:#1D9E75;margin-top:4px;}
#map{width:100%;height:500px;display:block;}
.bottom{padding:16px 24px 20px;border-top:0.5px solid #2a2d38;background:#0f1117;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.leg{display:flex;align-items:center;gap:6px;font-size:11px;color:#6b6f7e;}
.leg-line{width:18px;height:3px;border-radius:2px;flex-shrink:0;}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.seg-list{display:flex;flex-direction:column;gap:5px;}
.seg{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:9px;border:0.5px solid #2a2d38;background:#161820;font-size:13px;}
.seg.done{border-color:#1D9E75;border-left-width:3px;cursor:pointer;transition:background .12s;}
.seg.done:hover{background:#19221e;}
.seg.todo{border-left:3px solid #2a2d38;}
.seg-name{flex:1;font-weight:500;color:#c8c6bf;letter-spacing:-0.01em;}
.seg-date{font-size:11px;color:#6b6f7e;white-space:nowrap;}
.seg-km{font-size:12px;color:#8b8f9e;white-space:nowrap;}
.seg-km em{color:#4a4d5a;font-style:normal;}
.badge{font-size:10px;padding:3px 8px;border-radius:99px;font-weight:500;letter-spacing:.02em;white-space:nowrap;}
.b-done{background:#083a28;color:#1D9E75;}
.b-todo{background:#1e1e24;color:#4a4d5a;}
.leaflet-tooltip-own{background:#1e202a!important;color:#e8e6df!important;border:0.5px solid #3a3d4a!important;border-radius:9px!important;padding:9px 13px!important;font-size:13px!important;font-family:'Inter',sans-serif!important;box-shadow:0 4px 20px rgba(0,0,0,.6)!important;pointer-events:none!important;white-space:nowrap!important;}
.leaflet-tooltip-own::before{display:none!important;}
.tt-name{font-weight:500;margin:0 0 3px;color:#e8e6df;font-size:13px;}
.tt-meta{font-size:11px;color:#8b8f9e;margin:0;}
.leaflet-popup-content-wrapper{background:#1e202a!important;border:0.5px solid #3a3d4a!important;border-radius:10px!important;color:#e8e6df!important;font-family:'Inter',sans-serif!important;box-shadow:0 4px 20px rgba(0,0,0,.5)!important;}
.leaflet-popup-tip{background:#1e202a!important;}
.leaflet-popup-content{margin:10px 14px!important;font-family:'Inter',sans-serif!important;}
.leaflet-bar a{background:#1e202a!important;color:#e8e6df!important;border-color:#3a3d4a!important;}
.leaflet-bar a:hover{background:#2a2d38!important;}
</style>
</head>

</div>

function makeLine(coords,col,hcol,w,ttHtml){
  const hit=L.polyline(coords,{color:'transparent',weight:22,opacity:0}).addTo(map);
  const line=L.polyline(coords,{color:col,weight:w,opacity:1,lineJoin:'round',lineCap:'round'}).addTo(map);
  line.bindTooltip(ttHtml,{sticky:true,className:'leaflet-tooltip-own',offset:[14,0]});
  const on=e=>{line.setStyle({color:hcol,weight:w+3});line.openTooltip(e.latlng);};
  const mv=e=>line.openTooltip(e.latlng);
  const off=()=>{line.setStyle({color:col,weight:w});line.closeTooltip();};
  [hit,line].forEach(l=>{l.on('mouseover',on);l.on('mousemove',mv);l.on('mouseout',off);});
  return line;
}

  const popCol=lh.done?'#1D9E75':(lh.active?'#378ADD':'#6b6f7e');
  L.marker([lh.lat,lh.lng],{icon:mkIcon(lh)}).addTo(map)
   .bindPopup(`<p style="font-weight:500;font-size:13px;margin:0 0 6px;color:#e8e6df;font-family:'Inter',sans-serif;">Latarnia ${lh.name}</p><span style="font-size:11px;padding:3px 9px;border-radius:99px;background:${popBg};color:${popCol};font-weight:500;">${label}</span>`);
});

function mkPt(c,bg,bd,label){
  L.marker(c,{icon:L.divIcon({className:'',html:`<div style="width:9px;height:9px;border-radius:50%;background:${bg};border:2px solid ${bd};box-sizing:border-box;"></div>`,iconSize:[9,9],iconAnchor:[4,4]})}).addTo(map).bindPopup(`<span style="font-size:13px;color:#e8e6df;font-family:'Inter',sans-serif;">${label}</span>`);
}
mkPt(COASTAL1[0],'#1D9E75','#085041','<b>Start 1:</b> Władysławowo');

const segs=[
  {name:'Władysławowo – Łeba',         date:'25 maja 2026',   kmC:92,  kmT:123, bounds:b1},
  {name:'Gdańsk Nowy Port',            date:'6 czerwca 2026', kmC:28,  kmT:34,  bounds:b2},
  {name:'Władysławowo – Gdynia',        date:'7 czerwca 2026', kmC:49,  kmT:49,  bounds:b3},
